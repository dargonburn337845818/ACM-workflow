name: Release VSIX + APK

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Setup Python (Knowledge Ladder)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate mobile data
        working-directory: knowledge-ladder
        run: |
          python3 export_mobile_data.py
          test -f mobile/www/data.js

      - name: Setup Node.js (Knowledge Ladder)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: knowledge-ladder/mobile
        run: npm install

      - name: Sync Android platform
        working-directory: knowledge-ladder/mobile
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: knowledge-ladder/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.vsix \
            knowledge-ladder/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --notes-file RELEASE_NOTES.md \
            --title "$GITHUB_REF_NAME"
