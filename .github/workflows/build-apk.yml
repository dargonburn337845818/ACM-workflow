name: Build Knowledge Ladder APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'knowledge-ladder/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate mobile data
        working-directory: knowledge-ladder
        run: |
          python3 export_mobile_data.py
          test -f mobile/www/data.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: knowledge-ladder/mobile
        run: npm install

      - name: Add Android platform
        working-directory: knowledge-ladder/mobile
        run: npx cap add android || true

      - name: Sync web assets
        working-directory: knowledge-ladder/mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: knowledge-ladder/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ladder-apk
          path: knowledge-ladder/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
