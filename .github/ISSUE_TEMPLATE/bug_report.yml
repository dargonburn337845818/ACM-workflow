name: Bug 报告
description: 提交可复现的缺陷，请勿附上真实密钥/日志中的敏感信息
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug。请先运行 `ACM Workflow: 工作流诊断` 并**脱敏**后再粘贴报告。
  - type: input
    id: version
    attributes:
      label: 扩展版本 / VS Code 版本
      placeholder: 0.22.0 / 1.85.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统
      placeholder: Windows 11 / WSL Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开... 2. 点击... 3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 应该...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志/诊断报告
      description: 请删除主目录、用户名、Cookie、API Key、代理地址等敏感信息。
      render: text
