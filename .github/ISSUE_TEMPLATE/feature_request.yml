name: 功能建议
description: 提出可执行的新功能或改进方向
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你希望解决什么用户场景？
      placeholder: 目前做 XX 很繁琐/做不到...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: 理想的交互/接口/行为...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选；如果考虑过其他做法请说明。
