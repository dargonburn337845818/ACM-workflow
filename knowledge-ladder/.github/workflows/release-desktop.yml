name: Release Desktop EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name KnowledgeLadder --collect-all PySide6 --add-data "style.qss;." --add-data "style_mac.qss;." main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeLadder-Windows-EXE
          path: dist/KnowledgeLadder.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KnowledgeLadder.exe
          generate_release_notes: true
