<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F0E6">
  <title>拆题引导</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top" data-parallax="0.15">
      <button id="themeToggle" class="theme-toggle">风格</button>
      <div class="step-count" id="stepCount">1 / 4</div>
    </header>

    <main id="stage" class="stage"></main>

    <div id="explainModal" class="explain-modal hidden">
      <div class="explain-mask" id="explainMask"></div>
      <div class="explain-sheet">
        <div class="explain-head">
          <div id="explainTitle" class="explain-title"></div>
          <button id="explainClose" class="close-btn">×</button>
        </div>
        <div id="explainBody" class="explain-body"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
