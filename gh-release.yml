# 由 gh-automation/scripts/install-repo-config.py 生成；改这里而不是改脚本。
# 说明：ghp.py 读取本文件；字段含义见 gh-automation/templates/release.yml。
repo: ACM-workflow
default_branch: main
version_source: package.json#version
build: npm ci && npm run compile
artifacts:
- out/**
checks:
- privacy
- style
ci_required: true
release:
  # Release 与资产（acm-workflow-<ver>.vsix + app-debug.apk）由仓库内
  # .github/workflows/release.yml 在推送 v* tag 时构建创建（沿用 v0.23.0 以来的形态）。
  # 本管道负责门禁 + push + tag；tag 推送后等 CI 建完 Release，再重跑本管道做远端回读（幂等）。
  enabled: false
  tag_prefix: v
  notes_from: CHANGELOG.md
allow_dirty: false
timeout_seconds: 300
retries: 2
local_dir: ACM-workflow-build
